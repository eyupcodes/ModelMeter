[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelmeter"
version = "0.1.0"
description = "Compare LLMs on quality, latency, token usage and cost over the same test set."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ModelMeter contributors" }]
keywords = ["llm", "benchmark", "evaluation", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.13,<1",
]

[project.scripts]
modelmeter = "modelmeter.cli:app"

[project.urls]
Homepage = "https://github.com/EXAMPLE/modelmeter"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmeter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format
